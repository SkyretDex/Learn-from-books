<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Reader: Game Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --accent: #4a90e2;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --gold: #ffd700;
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            flex-shrink: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item {
            padding: 12px 15px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .menu-item:hover {
            background: #333;
            color: #fff;
        }

        .menu-item.active {
            background: var(--bg-panel);
            color: var(--accent);
            font-weight: bold;
        }

        /* --- CONTENT --- */
        .main-content {
            flex-grow: 1;
            padding: 0;
            overflow-y: auto;
            position: relative;
        }

        .view-section {
            display: none;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .view-section.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* СЕТКА КНИГ */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #333;
        }

        .book-card:hover {
            transform: translateY(-5px);
            background: #2a2a2a;
        }

        .book-icon {
            font-size: 40px;
            color: #555;
            margin-bottom: 15px;
        }

        .book-title {
            font-size: 14px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .upload-btn {
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="file"] {
            display: none;
        }

        /* ЧИТАЛКА */
        #reader-container {
            max-width: 800px;
            margin: 0 auto;
            font-size: 20px;
            line-height: 1.8;
            padding-bottom: 150px;
        }

        .word {
            cursor: text;
            border-radius: 4px;
            padding: 1px 0;
        }

        .word:hover {
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        .word.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 5px var(--gold);
        }

        ::selection {
            background: rgba(74, 144, 226, 0.4);
            color: white;
        }

        /* Кнопка "Перевести выделенное" */
        #selection-tooltip {
            position: fixed;
            background: #222;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 2000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            transform: translateX(-50%);
        }

        #selection-tooltip:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* СЛОВАРЬ */
        .vocab-list {
            max-width: 600px;
        }

        .vocab-item {
            background: var(--bg-panel);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }

        .vocab-eng {
            font-weight: bold;
            font-size: 18px;
        }

        .vocab-rus {
            color: var(--text-muted);
        }

        .delete-word {
            cursor: pointer;
            color: #555;
        }

        .delete-word:hover {
            color: #d9534f;
        }

        /* --- ИГРА (КАРТОЧКИ) --- */
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .game-card {
            background: var(--bg-panel);
            padding: 50px 20px;
            border-radius: 20px;
            border: 2px solid #333;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .game-word {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .game-hint {
            color: #666;
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ddd;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: #333;
            border-color: #666;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: var(--green) !important;
            color: white !important;
            border-color: var(--green);
        }

        .option-btn.wrong {
            background: var(--red) !important;
            color: white !important;
            border-color: var(--red);
            opacity: 0.6;
        }

        .game-score {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--gold);
        }

        .start-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        /* ПОПАП ПЕРЕВОДА */
        #translation-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            background: #252525;
            padding: 20px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border: 1px solid #444;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 300px;
            max-width: 90%;
        }

        #translation-popup.visible {
            transform: translateX(-50%) translateY(0);
        }

        .popup-content {
            flex-grow: 1;
        }

        .popup-word {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            display: block;
            max-width: 500px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .popup-trans {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .save-btn {
            background: none;
            border: none;
            color: #555;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-btn:hover {
            color: var(--gold);
        }

        .save-btn.saved {
            color: var(--gold);
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
        }
    </style>
</head>

<body>

    <div id="loader"><i class="fas fa-spinner fa-spin fa-3x"></i>
        <p style="margin-top: 15px;">Обработка книги...</p>
    </div>

    <div id="selection-tooltip" onclick="translateSelection()">
        <i class="fas fa-language"></i> Перевести
    </div>

    <div class="sidebar">
        <div class="logo"><i class="fas fa-book-open"></i> Smart Reader</div>
        <div class="menu-item active" onclick="switchTab('library')"><i class="fas fa-layer-group"></i> Библиотека</div>
        <div class="menu-item" onclick="switchTab('dictionary')"><i class="fas fa-star"></i> Словарь</div>
        <div class="menu-item" onclick="switchTab('game')"><i class="fas fa-gamepad"></i> Тренировка</div>
    </div>

    <div class="main-content">

        <div id="tab-library" class="view-section active">
            <div class="header-area">
                <h2>Мои книги</h2>
                <label class="upload-btn">
                    <i class="fas fa-plus"></i> Загрузить PDF
                    <input type="file" id="file-upload" accept="application/pdf">
                </label>
            </div>
            <div class="book-grid" id="book-list">
                <div class="book-card" onclick="alert('Загрузите файл!')">
                    <div class="book-icon"><i class="fas fa-book"></i></div>
                    <div class="book-title">Загрузите книгу</div>
                </div>
            </div>
        </div>

        <div id="tab-reader" class="view-section">
            <div class="header-area">
                <button onclick="switchTab('library')" class="upload-btn" style="background: #333;">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
                <h3 id="current-book-title"
                    style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%;">Чтение</h3>
            </div>
            <div id="reader-container"></div>
        </div>

        <div id="tab-dictionary" class="view-section">
            <h2>Мой словарь</h2>
            <div id="vocab-list" class="vocab-list"></div>
        </div>

        <div id="tab-game" class="view-section">
            <div class="game-container" id="game-start-screen">
                <i class="fas fa-brain" style="font-size: 60px; color: var(--accent); margin-bottom: 20px;"></i>
                <h1>Проверь себя</h1>
                <p style="color: #aaa; margin-bottom: 30px;">Выберите правильный перевод для слов из вашего словаря.</p>
                <button class="start-btn" onclick="startGame()">Начать игру</button>
            </div>

            <div class="game-container" id="game-play-screen" style="display: none;">
                <div class="header-area" style="justify-content: center; margin-bottom: 20px;">
                    <span id="game-progress" style="color: #888;">1 / 10</span>
                </div>

                <div class="game-card">
                    <div class="game-word" id="quiz-word">Word</div>
                    <div class="game-hint">Выберите правильный перевод</div>
                </div>

                <div class="options-grid" id="quiz-options">
                </div>
            </div>

            <div class="game-container" id="game-end-screen" style="display: none;">
                <i class="fas fa-trophy" style="font-size: 60px; color: var(--gold); margin-bottom: 20px;"></i>
                <h1>Результат</h1>
                <div class="game-score" id="final-score">8 / 10</div>
                <button class="start-btn" onclick="startGame()">Играть снова</button>
            </div>
        </div>

    </div>

    <div id="translation-popup">
        <div class="popup-content">
            <span class="popup-word" id="p-original">WORD</span>
            <span class="popup-trans" id="p-translated">...</span>
        </div>
        <button class="save-btn" id="btn-save-word" onclick="toggleSaveWord()">
            <i class="fas fa-star"></i>
        </button>
    </div>

    <script>
        // ==========================================
        // 1. СПИСОК ТВОИХ КНИГ (РЕДАКТИРУЙ ЗДЕСЬ)
        // ==========================================
        const MY_BOOKS = [
            { title: "Гарри Поттер", filename: "harry.pdf" },
            { title: "Стив Джобс", filename: "jobs.pdf" },
            // Добавляй сюда новые книги: { title: "Название", filename: "имя_файла.pdf" },
        ];
        // ==========================================

        // --- ДАННЫЕ ---
        let myVocabulary = JSON.parse(localStorage.getItem('myVocabulary')) || [];
        let currentWordData = null;
        let lastSelectedText = "";

        // Переменные для игры
        let gameQueue = [];
        let currentQuestionIndex = 0;
        let gameScore = 0;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        renderVocabulary();
        renderCloudBooks(); // Загружаем список книг из кода

        // --- ФУНКЦИЯ ВЫВОДА КНИГ (ИЗ КОДА) ---
        function renderCloudBooks() {
            const grid = document.getElementById('book-list');
            // Очищаем, оставляем только кнопку загрузки (если она была в html, но у нас grid пустой при старте)
            grid.innerHTML = '';

            // 1. Рисуем карточки для "Вшитых" книг
            MY_BOOKS.forEach(book => {
                const div = document.createElement('div');
                div.className = 'book-card';
                div.innerHTML = `
                <div class="book-icon"><i class="fas fa-book" style="color:var(--accent)"></i></div>
                <div class="book-title">${book.title}</div>
            `;
                div.onclick = () => loadBookFromUrl('books/' + book.filename, book.title);
                grid.appendChild(div);
            });

            // 2. Добавляем карточку-заглушку, если книг нет
            if (MY_BOOKS.length === 0) {
                const div = document.createElement('div');
                div.className = 'book-card';
                div.innerHTML = `<div class="book-title">Добавьте файлы в папку books/ и обновите код</div>`;
                grid.appendChild(div);
            }
        }

        // --- ФУНКЦИЯ ЗАГРУЗКИ КНИГИ ПО ССЫЛКЕ (С СЕРВЕРА) ---
        async function loadBookFromUrl(url, title) {
            document.getElementById('loader').style.display = 'flex';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Файл не найден");

                const blob = await response.blob();
                const arrayBuffer = await blob.arrayBuffer();

                processPdfData(arrayBuffer, title);

            } catch (error) {
                alert("Не удалось открыть книгу. Убедитесь, что файл " + url + " существует в папке books.");
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- ОБЩАЯ ФУНКЦИЯ ОБРАБОТКИ PDF ---
        async function processPdfData(typedarray, title) {
            try {
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                const maxPages = Math.min(pdf.numPages, 50); // Лимит 50 страниц

                for (let i = 1; i <= maxPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageStrings = textContent.items.map(item => item.str);
                    fullText += pageStrings.join(' ') + "\n\n";
                }

                renderReader(fullText, title);
                document.getElementById('loader').style.display = 'none';
                switchTab('reader');
            } catch (err) {
                console.error(err);
                alert("Ошибка чтения структуры PDF.");
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- ЗАГРУЗКА ЛОКАЛЬНОГО ФАЙЛА (КНОПКА +) ---
        document.getElementById('file-upload').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loader').style.display = 'flex';

            const fileReader = new FileReader();
            fileReader.onload = async function (ev) {
                processPdfData(new Uint8Array(ev.target.result), file.name);
            };
            fileReader.readAsArrayBuffer(file);
        });

        // ... (ОСТАЛЬНОЙ КОД: renderReader, translateSelection, game logic) ...
        // Вставь сюда остальной код функций из предыдущего ответа:
        // renderReader, handleWordClick, fetchTranslation, translateSelection,
        // switchTab, toggleSaveWord, renderVocabulary, removeWord, game functions
        // document events listeners...

        // ! ВАЖНО: Ниже я дублирую старые функции, чтобы ты мог скопировать скрипт целиком !

        function renderReader(text, title) {
            document.getElementById('current-book-title').textContent = title;
            const container = document.getElementById('reader-container');
            container.innerHTML = '';
            const paragraphs = text.split(/\n\s*\n/);
            paragraphs.forEach(para => {
                if (!para.trim()) return;
                const p = document.createElement('p');
                const words = para.split(/([a-zA-Z’'-]+)/);
                words.forEach(frag => {
                    if (/[a-zA-Z]/.test(frag)) {
                        const span = document.createElement('span');
                        span.className = 'word';
                        span.textContent = frag;
                        span.onclick = (e) => handleWordClick(e.target);
                        p.appendChild(span);
                    } else { p.appendChild(document.createTextNode(frag)); }
                });
                container.appendChild(p);
            });
        }

        // Обработка выделения
        document.addEventListener('mouseup', function (e) {
            if (e.target.closest('#selection-tooltip')) return;
            const tooltip = document.getElementById('selection-tooltip');
            const selection = window.getSelection();
            const text = selection.toString().trim();
            if (!text || text.length < 2) { tooltip.style.display = 'none'; return; }
            if (e.target.closest('#translation-popup')) return;
            lastSelectedText = text;
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            let top = rect.top - 40;
            if (top < 10) top = rect.bottom + 10;
            tooltip.style.left = (rect.left + (rect.width / 2)) + 'px';
            tooltip.style.top = top + 'px';
            tooltip.style.display = 'block';
        });

        function translateSelection() {
            if (lastSelectedText) {
                fetchTranslation(lastSelectedText);
                document.getElementById('selection-tooltip').style.display = 'none';
                window.getSelection().removeAllRanges();
            }
        }

        async function fetchTranslation(text) {
            const popup = document.getElementById('translation-popup');
            const pOriginal = document.getElementById('p-original');
            const pTrans = document.getElementById('p-translated');
            const btnSave = document.getElementById('btn-save-word');
            popup.classList.add('visible');
            pOriginal.textContent = text;
            pTrans.textContent = "Перевод...";
            const isSaved = myVocabulary.some(item => item.original === text.toLowerCase());
            btnSave.className = isSaved ? 'save-btn saved' : 'save-btn';
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                let translation = "";
                if (data && data[0]) { data[0].forEach(part => { if (part[0]) translation += part[0]; }); }
                pTrans.textContent = translation;
                currentWordData = { original: text.toLowerCase(), translation: translation };
            } catch (e) { pTrans.textContent = "Ошибка перевода"; }
        }

        function handleWordClick(el) {
            document.querySelectorAll('.word.active').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            const cleanWord = el.textContent.replace(/[^a-zA-Z-]/g, "").trim();
            fetchTranslation(cleanWord);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            const menuItems = document.querySelectorAll('.menu-item');
            if (tabName === 'library') menuItems[0].classList.add('active');
            if (tabName === 'dictionary') { menuItems[1].classList.add('active'); renderVocabulary(); }
            if (tabName === 'game') menuItems[2].classList.add('active');
        }

        function toggleSaveWord() {
            if (!currentWordData) return;
            const btn = document.getElementById('btn-save-word');
            const existingIndex = myVocabulary.findIndex(w => w.original === currentWordData.original);
            if (existingIndex >= 0) {
                myVocabulary.splice(existingIndex, 1);
                btn.classList.remove('saved');
            } else {
                myVocabulary.push(currentWordData);
                btn.classList.add('saved');
            }
            localStorage.setItem('myVocabulary', JSON.stringify(myVocabulary));
            if (document.getElementById('tab-dictionary').classList.contains('active')) renderVocabulary();
        }

        function renderVocabulary() {
            const list = document.getElementById('vocab-list');
            list.innerHTML = '';
            if (myVocabulary.length === 0) { list.innerHTML = '<p style="text-align:center; color:#555;">Словарь пуст</p>'; return; }
            [...myVocabulary].reverse().forEach((item, index) => {
                const originalIndex = myVocabulary.length - 1 - index;
                const div = document.createElement('div');
                div.className = 'vocab-item';
                div.innerHTML = `<div><div class="vocab-eng">${item.original}</div><div class="vocab-rus">${item.translation}</div></div><i class="fas fa-trash delete-word" onclick="removeWord(${originalIndex})"></i>`;
                list.appendChild(div);
            });
        }

        function removeWord(index) {
            myVocabulary.splice(index, 1);
            localStorage.setItem('myVocabulary', JSON.stringify(myVocabulary));
            renderVocabulary();
        }

        // GAME LOGIC
        function startGame() {
            if (myVocabulary.length < 4) { alert("Сохраните минимум 4 слова!"); switchTab('dictionary'); return; }
            document.getElementById('game-start-screen').style.display = 'none';
            document.getElementById('game-end-screen').style.display = 'none';
            document.getElementById('game-play-screen').style.display = 'block';
            gameQueue = [...myVocabulary].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentQuestionIndex = 0;
            gameScore = 0;
            showQuestion();
        }

        function showQuestion() {
            const currentItem = gameQueue[currentQuestionIndex];
            document.getElementById('game-progress').textContent = `${currentQuestionIndex + 1} / ${gameQueue.length}`;
            document.getElementById('quiz-word').textContent = currentItem.original;
            let options = [currentItem];
            let distractors = myVocabulary.filter(w => w.original !== currentItem.original).sort(() => 0.5 - Math.random()).slice(0, 3);
            options = options.concat(distractors).sort(() => 0.5 - Math.random());
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.translation;
                btn.onclick = () => checkAnswer(opt, currentItem, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, correctOption, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            if (selectedOption.original === correctOption.original) { btnElement.classList.add('correct'); gameScore++; }
            else {
                btnElement.classList.add('wrong');
                allBtns.forEach(b => { if (b.textContent === correctOption.translation) b.classList.add('correct'); });
            }
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < gameQueue.length) showQuestion(); else endGame();
            }, 1200);
        }

        function endGame() {
            document.getElementById('game-play-screen').style.display = 'none';
            document.getElementById('game-end-screen').style.display = 'block';
            document.getElementById('final-score').textContent = `Ваш счет: ${gameScore} из ${gameQueue.length}`;
        }

        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('#selection-tooltip')) { document.getElementById('selection-tooltip').style.display = 'none'; }
            const popup = document.getElementById('translation-popup');
            if (!popup.contains(e.target) && !e.target.classList.contains('word') && !e.target.closest('.save-btn') && !e.target.closest('#selection-tooltip')) {
                popup.classList.remove('visible');
                document.querySelectorAll('.word.active').forEach(e => e.classList.remove('active'));
            }
        });
    </script>
</body>

</html>
