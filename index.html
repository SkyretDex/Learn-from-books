<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Reader: Final App</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #4a90e2;
            --text: #e0e0e0;
            --gold: #ffd700;
            --green: #2ecc71;
            --red: #e74c3c;

            /* Переменные для читалки */
            --reader-font: 'Roboto', sans-serif;
            --reader-size: 22px;
            --reader-line-height: 1.6;
            --reader-bg: #121212;
            --reader-text: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            flex-shrink: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #fff;
            display: flex;
            gap: 10px;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .logo:hover {
            color: var(--accent);
        }

        .menu-item {
            padding: 12px;
            color: #aaa;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            gap: 10px;
            transition: 0.2s;
        }

        .menu-item:hover {
            background: #333;
            color: #fff;
        }

        .menu-item.active {
            background: var(--panel);
            color: var(--accent);
            font-weight: bold;
        }

        /* MAIN CONTENT */
        .main {
            flex-grow: 1;
            padding: 0;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            display: none;
            padding: 40px;
            height: 100%;
            overflow-y: auto;
        }

        .view-section.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* LIBRARY GRID */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #333;
            position: relative;
            transition: 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .book-icon {
            font-size: 40px;
            color: #555;
            margin-bottom: 15px;
        }

        .book-title {
            font-size: 14px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .book-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }

        .btn-edit,
        .btn-delete {
            color: #555;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-edit:hover {
            color: var(--accent);
        }

        .btn-delete:hover {
            color: var(--red);
        }

        .btn-upload {
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="file"] {
            display: none;
        }

        /* READER & SETTINGS */
        #view-reader {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 0;
        }

        .reader-header {
            padding: 10px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #252525;
            padding: 5px 15px;
            border-radius: 8px;
        }

        .font-select {
            background: #333;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        .size-btn {
            background: #333;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .size-btn:hover {
            background: #444;
        }

        .page-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            /* Динамические стили */
            font-size: var(--reader-size);
            font-family: var(--reader-font);
            line-height: var(--reader-line-height);
            background: var(--reader-bg);
            color: var(--reader-text);
            transition: background 0.3s, color 0.3s;
        }

        .theme-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        .theme-btn.dark {
            background: #121212;
        }

        .theme-btn.light {
            background: #ffffff;
        }

        .theme-btn.sepia {
            background: #f4ecd8;
        }

        .theme-btn.night {
            background: #1a1a2e;
        }

        .chapter-break {
            page-break-before: always;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
        }

        .chapter-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--reader-text);
        }

        .pagination-controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }

        .page-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 14px;
            color: #888;
        }

        .word {
            cursor: pointer;
            border-radius: 3px;
        }

        .word:hover {
            background: #333;
            color: #fff;
        }

        .word.active {
            background: var(--gold);
            color: #000;
        }

        ::selection {
            background: rgba(74, 144, 226, 0.4);
            color: white;
        }

        /* DICTIONARY & POPUP */
        .vocab-list {
            max-width: 600px;
            margin-top: 20px;
        }

        .vocab-item {
            background: var(--panel);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid var(--accent);
        }

        #trans-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            background: #222;
            padding: 20px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid #444;
            transition: 0.3s;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            min-width: 300px;
        }

        #trans-popup.visible {
            transform: translateX(-50%) translateY(0);
        }

        .save-btn {
            font-size: 22px;
            color: #555;
            cursor: pointer;
            background: none;
            border: none;
        }

        .save-btn.saved {
            color: var(--gold);
        }

        #tooltip {
            position: fixed;
            background: #222;
            padding: 8px 12px;
            border-radius: 5px;
            display: none;
            cursor: pointer;
            border: 1px solid #444;
            z-index: 2000;
            font-weight: bold;
        }

        /* GAME */
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid #333;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--green));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .game-card {
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(145deg, #1e1e2e, #252538);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--gold), var(--green));
        }

        .game-word {
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(74, 144, 226, 0.3);
        }

        .game-hint {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .option-btn {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 18px 20px;
            background: linear-gradient(145deg, #2a2a3e, #1f1f2e);
            border: 2px solid #3a3a5a;
            color: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: linear-gradient(145deg, #2f2f45, #252538);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.2);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: linear-gradient(145deg, #1e5a3a, #145535);
            border-color: var(--green);
            animation: pulse-correct 0.5s ease;
        }

        .option-btn.wrong {
            background: linear-gradient(145deg, #5a1e1e, #4a1515);
            border-color: var(--red);
            animation: shake 0.5s ease;
        }

        .option-btn.show-correct {
            background: linear-gradient(145deg, #1e5a3a, #145535);
            border-color: var(--green);
        }

        @keyframes pulse-correct {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .game-result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .game-result.success {
            background: rgba(46, 204, 113, 0.1);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .game-result.error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .next-btn {
            margin-top: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--accent), #357abd);
            border: none;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.4);
        }

        .game-empty {
            text-align: center;
            padding: 60px 40px;
            background: var(--panel);
            border-radius: 20px;
            border: 2px dashed #444;
        }

        .game-empty i {
            font-size: 60px;
            color: #444;
            margin-bottom: 20px;
        }

        .game-empty h3 {
            color: #888;
            margin-bottom: 10px;
        }

        .game-empty p {
            color: #666;
            font-size: 14px;
        }

        .game-mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 24px;
            background: #252538;
            border: 1px solid #3a3a5a;
            color: #888;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .mode-btn:hover {
            border-color: var(--accent);
            color: #fff;
        }

        .mode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* FULLSCREEN MODE */
        .fullscreen-mode .sidebar {
            display: none !important;
        }

        .fullscreen-mode .reader-header {
            display: none !important;
        }



        .fullscreen-mode .page-content p {
            break-inside: avoid;
        }

        .fullscreen-mode .page-content .chapter-break {
            break-before: column;
        }

        .fullscreen-btn {
            background: #333;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover {
            background: var(--accent);
        }

        /* Bottom Settings Panel */
        .bottom-settings {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            padding: 15px 20px;
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .fullscreen-mode .bottom-settings {
            display: none;
        }

        .fullscreen-mode .bottom-settings.visible {
            display: block;
        }

        /* Fullscreen Navigation Arrows */
        .fs-nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 50px;
            height: 80px;
            cursor: pointer;
            font-size: 24px;
            z-index: 998;
            transition: all 0.2s;
            display: none;
        }

        .fs-nav-arrow:hover {
            background: rgba(74, 144, 226, 0.7);
        }

        .fs-nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .fullscreen-mode .fs-nav-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fs-nav-prev {
            left: 0;
            border-radius: 0 8px 8px 0;
        }

        .fs-nav-next {
            right: 0;
            border-radius: 8px 0 0 8px;
        }

        .fs-page-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: auto;
            background: rgba(0, 0, 0, 0.6);
            color: #888;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 998;
            display: none;
        }

        .fullscreen-mode .fs-page-indicator {
            display: block;
        }

        .bottom-settings-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            /* Allow wrapping */
            justify-content: center;
            /* Center items */
            align-items: center;
            gap: 15px 30px;
            /* Vertical gap 15px, Horizontal 30px */
            padding-right: 60px;
            /* Space for exit button if needed */
        }

        .bottom-settings-group {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            /* Prevent splitting group label/control */
        }

        .bottom-settings-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            left: auto;
            transform: none;
            background: rgba(30, 30, 30, 0.9);
            color: #ccc;
            border: 1px solid #444;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 1001;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .settings-toggle-btn:hover {
            background: var(--accent);
            color: white;
            transform: rotate(90deg);
        }

        .fullscreen-mode .settings-toggle-btn {
            display: flex;
        }

        .fullscreen-mode .settings-toggle-btn.active {
            background: var(--accent);
            color: white;
            transform: rotate(90deg);
            bottom: 160px;
            /* Move higher to clear wrapped menu */
        }



        /* Adjust page content to be safer from bottom cutoff */
        .fullscreen-mode .page-content {
            max-width: none;
            width: 100%;
            height: 100vh;
            /* Use full height */
            padding: 40px 60px 80px;
            /* 80px bottom padding */
            margin: 0;
            overflow: hidden;
            column-width: 600px;
            column-gap: 80px;
            column-fill: auto;
            /* Ensure columns use full height minus padding */
        }

        .exit-fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .exit-fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .fullscreen-pagination {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fullscreen-pagination .page-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo" onclick="app.nav('library')">
            <i class="fas fa-book-reader"></i> SmartReader
        </div>
        <div class="menu-item active" onclick="app.nav('library')"><i class="fas fa-th-large"></i> Библиотека</div>
        <div class="menu-item" onclick="app.nav('dictionary')"><i class="fas fa-star"></i> Словарь</div>
        <div class="menu-item" onclick="app.nav('game')"><i class="fas fa-gamepad"></i> Тренировка</div>
    </div>

    <div class="main">

        <div id="view-library" class="view-section active">
            <div class="header">
                <h2>Моя библиотека</h2>
                <label class="btn-upload">
                    <i class="fas fa-plus"></i> Добавить книгу
                    <input type="file" onchange="app.uploadBook(this)" accept="application/pdf">
                </label>
            </div>
            <div id="library-grid" class="grid"></div>
        </div>

        <div id="view-reader" class="view-section" style="padding: 0; display: none;">
            <div class="reader-header">
                <button onclick="app.nav('library')"
                    style="background:none; border:none; color:#888; cursor:pointer; font-size:16px;">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>

                <div class="settings-bar">
                    <span style="font-size:12px; color:#888"><i class="fas fa-font"></i></span>
                    <select id="font-family" class="font-select" onchange="settings.setFont(this.value)">
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Merriweather', serif">Merriweather</option>
                        <option value="'Lora', serif">Lora</option>
                        <option value="'Open Sans', sans-serif">Open Sans</option>
                        <option value="'Playfair Display', serif">Playfair</option>
                    </select>
                    <div style="width:1px; height:20px; background:#444"></div>
                    <button class="size-btn" onclick="settings.changeSize(-2)">-</button>
                    <span id="font-size-val" style="font-size:14px; color:#fff; width:30px; text-align:center">22</span>
                    <button class="size-btn" onclick="settings.changeSize(2)">+</button>
                    <div style="width:1px; height:20px; background:#444"></div>
                    <div class="theme-selector">
                        <button class="theme-btn dark active" onclick="settings.setTheme('dark')"
                            title="Тёмная тема"></button>
                        <button class="theme-btn light" onclick="settings.setTheme('light')"
                            title="Светлая тема"></button>
                        <button class="theme-btn sepia" onclick="settings.setTheme('sepia')" title="Сепия"></button>
                        <button class="theme-btn night" onclick="settings.setTheme('night')"
                            title="Ночная тема"></button>
                    </div>
                </div>

                <div class="pagination-controls">
                    <button class="page-btn" id="btn-prev" onclick="reader.changePage(-1)"><i
                            class="fas fa-chevron-left"></i></button>
                    <span class="page-info" id="page-info">1 / ?</span>
                    <button class="page-btn" id="btn-next" onclick="reader.changePage(1)"><i
                            class="fas fa-chevron-right"></i></button>
                    <button class="fullscreen-btn" onclick="fullscreen.toggle()" title="Полноэкранный режим">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>

            <div id="page-content" class="page-content"></div>

            <!-- Fullscreen Navigation UI -->
            <button class="fs-nav-arrow fs-nav-prev" onclick="fullscreen.prevScreen()">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="fs-nav-arrow fs-nav-next" onclick="fullscreen.nextScreen()">
                <i class="fas fa-chevron-right"></i>
            </button>
            <div class="fs-page-indicator" id="fs-page-indicator">Стр. 1</div>

            <!-- Fullscreen Settings Toggle Button (Icon only) -->
            <button class="settings-toggle-btn" id="settings-toggle" onclick="fullscreen.toggleSettings()">
                <i class="fas fa-cog"></i>
            </button>

            <!-- Bottom Settings Panel for Fullscreen Mode -->
            <div class="bottom-settings" id="bottom-settings">
                <div class="bottom-settings-content">
                    <div class="bottom-settings-group">
                        <span class="bottom-settings-label">Шрифт</span>
                        <select id="font-family-fs" class="font-select" onchange="settings.setFont(this.value)">
                            <option value="'Roboto', sans-serif">Roboto</option>
                            <option value="'Merriweather', serif">Merriweather</option>
                            <option value="'Lora', serif">Lora</option>
                            <option value="'Open Sans', sans-serif">Open Sans</option>
                            <option value="'Playfair Display', serif">Playfair</option>
                        </select>
                    </div>

                    <div class="bottom-settings-group">
                        <span class="bottom-settings-label">Размер</span>
                        <button class="size-btn" onclick="settings.changeSize(-2)">-</button>
                        <span id="font-size-val-fs"
                            style="font-size:14px; color:#fff; width:30px; text-align:center">22</span>
                        <button class="size-btn" onclick="settings.changeSize(2)">+</button>
                    </div>

                    <div class="bottom-settings-group">
                        <span class="bottom-settings-label">Тема</span>
                        <div class="theme-selector">
                            <button class="theme-btn dark" onclick="settings.setTheme('dark')" title="Тёмная"></button>
                            <button class="theme-btn light" onclick="settings.setTheme('light')"
                                title="Светлая"></button>
                            <button class="theme-btn sepia" onclick="settings.setTheme('sepia')" title="Сепия"></button>
                            <button class="theme-btn night" onclick="settings.setTheme('night')"
                                title="Ночная"></button>
                        </div>
                    </div>

                    <div class="bottom-settings-group fullscreen-pagination">
                        <button class="page-btn" onclick="reader.changePage(-1)"><i
                                class="fas fa-chevron-left"></i></button>
                        <span class="page-info" id="page-info-fs">1 / ?</span>
                        <button class="page-btn" onclick="reader.changePage(1)"><i
                                class="fas fa-chevron-right"></i></button>
                    </div>

                    <button class="exit-fullscreen-btn" onclick="fullscreen.toggle()">
                        <i class="fas fa-compress"></i> Выйти
                    </button>
                </div>
            </div>
        </div>

        <div id="view-dictionary" class="view-section">
            <h2>Сохраненные слова</h2>
            <div id="vocab-list" class="vocab-list"></div>
        </div>

        <div id="view-game" class="view-section">
            <div id="game-ui"></div>
        </div>

    </div>

    <div id="trans-popup">
        <div style="flex-grow:1">
            <div id="p-orig" style="font-size:12px; color:#888; text-transform:uppercase">WORD</div>
            <div id="p-trans" style="font-size:18px; font-weight:bold; color:#fff">...</div>
        </div>
        <button class="save-btn" id="btn-star" onclick="vocab.toggle()"><i class="fas fa-star"></i></button>
    </div>

    <div id="tooltip" onclick="translator.translateSelection()">Перевести</div>

    <script>
        /* =========================================
           DATABASE (IndexedDB)
           ========================================= */
        const DB = {
            db: null,
            init() {
                return new Promise((resolve) => {
                    const request = indexedDB.open("SmartReaderDB", 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains("books")) {
                            db.createObjectStore("books", { keyPath: "id", autoIncrement: true });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                });
            },
            addBook(title, blob) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction("books", "readwrite");
                    tx.objectStore("books").add({ title, blob, currentPage: 1, date: Date.now() });
                    tx.oncomplete = () => resolve();
                });
            },
            getBooks() {
                return new Promise((resolve) => {
                    const tx = this.db.transaction("books", "readonly");
                    const req = tx.objectStore("books").getAll();
                    req.onsuccess = () => resolve(req.result);
                });
            },
            getBook(id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction("books", "readonly");
                    const req = tx.objectStore("books").get(id);
                    req.onsuccess = () => resolve(req.result);
                });
            },
            deleteBook(id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction("books", "readwrite");
                    tx.objectStore("books").delete(id);
                    tx.oncomplete = () => resolve();
                });
            },
            updateProgress(id, page) {
                const tx = this.db.transaction("books", "readwrite");
                const store = tx.objectStore("books");
                store.get(id).onsuccess = (e) => {
                    const data = e.target.result;
                    if (data) {
                        data.currentPage = page;
                        store.put(data);
                    }
                };
            },
            renameBook(id, newTitle) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction("books", "readwrite");
                    const store = tx.objectStore("books");
                    store.get(id).onsuccess = (e) => {
                        const data = e.target.result;
                        if (data) {
                            data.title = newTitle;
                            store.put(data);
                        }
                    };
                    tx.oncomplete = () => resolve();
                });
            }
        };

        /* =========================================
           SETTINGS LOGIC (NEW!)
           ========================================= */
        const settings = {
            fontSize: 22,
            fontFamily: "'Roboto', sans-serif",
            theme: 'dark',

            themes: {
                dark: { bg: '#121212', text: '#e0e0e0' },
                light: { bg: '#ffffff', text: '#1a1a1a' },
                sepia: { bg: '#f4ecd8', text: '#5b4636' },
                night: { bg: '#1a1a2e', text: '#a0a0c0' }
            },

            init() {
                // Загрузка настроек
                const savedSize = localStorage.getItem('reader-size');
                const savedFont = localStorage.getItem('reader-font');
                const savedTheme = localStorage.getItem('reader-theme');

                if (savedSize) this.fontSize = parseInt(savedSize);
                if (savedFont) this.fontFamily = savedFont;
                if (savedTheme) this.theme = savedTheme;

                this.apply();

                // Обновляем UI
                document.getElementById('font-size-val').textContent = this.fontSize;
                document.getElementById('font-family').value = this.fontFamily;
                this.updateThemeButtons();
            },

            changeSize(delta) {
                this.fontSize += delta;
                if (this.fontSize < 14) this.fontSize = 14;
                if (this.fontSize > 40) this.fontSize = 40;

                document.getElementById('font-size-val').textContent = this.fontSize;
                const fsSizeVal = document.getElementById('font-size-val-fs');
                if (fsSizeVal) fsSizeVal.textContent = this.fontSize;
                this.save();
                this.apply();
            },

            setFont(font) {
                this.fontFamily = font;
                this.save();
                this.apply();
            },

            setTheme(themeName) {
                if (this.themes[themeName]) {
                    this.theme = themeName;
                    this.save();
                    this.apply();
                    this.updateThemeButtons();
                }
            },

            updateThemeButtons() {
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.classList.contains(this.theme)) {
                        btn.classList.add('active');
                    }
                });
            },

            save() {
                localStorage.setItem('reader-size', this.fontSize);
                localStorage.setItem('reader-font', this.fontFamily);
                localStorage.setItem('reader-theme', this.theme);
            },

            apply() {
                const theme = this.themes[this.theme];
                document.documentElement.style.setProperty('--reader-size', this.fontSize + 'px');
                document.documentElement.style.setProperty('--reader-font', this.fontFamily);
                document.documentElement.style.setProperty('--reader-bg', theme.bg);
                document.documentElement.style.setProperty('--reader-text', theme.text);

                // If fullscreen, update indicator because reflow might happen
                this.syncFullscreenUI();
            },

            syncFullscreenUI() {
                // Sync font size display
                const fsSizeVal = document.getElementById('font-size-val-fs');
                if (fsSizeVal) fsSizeVal.textContent = this.fontSize;

                // Sync font family selector
                const fsFontSelect = document.getElementById('font-family-fs');
                if (fsFontSelect) fsFontSelect.value = this.fontFamily;

                // Update indicator as content might reflow
                if (typeof fullscreen !== 'undefined' && fullscreen.isActive) {
                    // Small timeout to allow CSS application
                    setTimeout(() => fullscreen.updateIndicator(), 50);
                }
            }
        };

        /* =========================================
           FULLSCREEN MODE LOGIC
           ========================================= */
        const fullscreen = {
            isActive: false,
            settingsOpen: false,

            toggle() {
                this.isActive = !this.isActive;
                document.body.classList.toggle('fullscreen-mode', this.isActive);

                if (this.isActive) {
                    // Sync UI when entering fullscreen
                    settings.syncFullscreenUI();
                    settings.updateThemeButtons();
                    this.updatePageInfo();
                } else {
                    // Close settings panel when exiting
                    this.settingsOpen = false;
                    document.getElementById('bottom-settings').style.display = 'none';
                    document.getElementById('settings-toggle').classList.remove('active');
                }
            },

            enter() {
                if (!this.isActive) this.toggle();
            },

            exit() {
                if (this.isActive) this.toggle();
            },

            toggleSettings() {
                this.settingsOpen = !this.settingsOpen;
                const panel = document.getElementById('bottom-settings');
                const btn = document.getElementById('settings-toggle');

                if (this.settingsOpen) {
                    panel.style.display = 'block';
                    btn.classList.add('active');
                } else {
                    panel.style.display = 'none';
                    btn.classList.remove('active');
                }
            },

            updatePageInfo() {
                const pageInfoFs = document.getElementById('page-info-fs');
                if (pageInfoFs && reader.pdf) {
                    pageInfoFs.textContent = `${reader.pageNum} / ${reader.totalPages}`;
                }
                this.updateIndicator();
            },

            // Column Navigation Logic
            nextScreen() {
                const container = document.getElementById('page-content');
                const scrollAmount = container.clientWidth + 80; // width + gap

                if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 10) {
                    // Start of next book page if available
                    reader.changePage(1);
                } else {
                    container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    this.updateIndicator();
                }
            },

            prevScreen() {
                const container = document.getElementById('page-content');
                const scrollAmount = container.clientWidth + 80;

                if (container.scrollLeft <= 0) {
                    // Go to prev book page
                    reader.changePage(-1);
                } else {
                    container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    this.updateIndicator();
                }
            },

            updateIndicator() {
                const container = document.getElementById('page-content');
                if (!container) return;

                // Calculate virtual screens
                const scrollW = container.clientWidth + 80;
                // Total scroll width might slightly vary due to browser rendering, use Math.ceil
                const totalScreens = Math.max(1, Math.ceil(container.scrollWidth / scrollW));
                const currentScreen = Math.min(totalScreens, Math.round(container.scrollLeft / scrollW) + 1);

                const indicator = document.getElementById('fs-page-indicator');
                if (indicator) {
                    indicator.textContent = `Стр. ${reader.pageNum} (${currentScreen}/${totalScreens})`;
                }

                // Update navigation buttons visibility if needed
                const prev = document.querySelector('.fs-nav-prev');
                const next = document.querySelector('.fs-nav-next');

                if (prev) prev.style.display = (reader.pageNum === 1 && currentScreen === 1) ? 'none' : 'flex';
                // Always show next if likely to have next page or screen
                if (next) next.style.display = 'flex';
            }
        };

        // Swipe Gesture Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            if (fullscreen.isActive) {
                touchStartX = e.changedTouches[0].screenX;
            }
        }, false);

        document.addEventListener('touchend', e => {
            if (fullscreen.isActive) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }
        }, false);

        function handleSwipe() {
            const threshold = 50; // min swipe distance
            if (touchEndX < touchStartX - threshold) {
                // Swipe Left -> Next Page
                fullscreen.nextScreen();
            }

            if (touchEndX > touchStartX + threshold) {
                // Swipe Right -> Prev Page
                fullscreen.prevScreen();
            }
        }

        // Listen for resize to update indicator
        window.addEventListener('resize', () => {
            if (typeof fullscreen !== 'undefined' && fullscreen.isActive) {
                fullscreen.updateIndicator();
            }
        });

        // Keyboard navigation for fullscreen
        document.addEventListener('keydown', (e) => {
            if (!fullscreen.isActive) return;

            if (e.key === 'ArrowRight' || e.key === 'Space') {
                fullscreen.nextScreen();
            } else if (e.key === 'ArrowLeft') {
                fullscreen.prevScreen();
            }
        });

        /* =========================================
           APP LOGIC
           ========================================= */
        const app = {
            async init() {
                await DB.init();
                settings.init(); // Инициализация настроек
                this.renderLibrary();
                vocab.render();
            },

            nav(view) {
                document.querySelectorAll('.view-section').forEach(el => {
                    el.style.display = 'none';
                    el.classList.remove('active');
                });
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));

                const target = document.getElementById('view-' + view);
                if (target) {
                    target.style.display = (view === 'reader') ? 'flex' : 'block';
                    setTimeout(() => target.classList.add('active'), 10);
                }

                // Exit fullscreen if leaving reader
                if (view !== 'reader' && typeof fullscreen !== 'undefined') {
                    fullscreen.exit();
                }

                const menuIndex = { 'library': 0, 'dictionary': 1, 'game': 2 }[view];
                if (menuIndex !== undefined) {
                    const menuItems = document.querySelectorAll('.menu-item');
                    if (menuItems[menuIndex]) {
                        menuItems[menuIndex].classList.add('active');
                    }
                }

                if (view === 'game') game.start();
                if (view === 'library') this.renderLibrary();
            },

            async uploadBook(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const blob = new Blob([e.target.result], { type: 'application/pdf' });
                    await DB.addBook(file.name.replace('.pdf', ''), blob);
                    this.renderLibrary();
                    alert("Книга добавлена!");
                };
                reader.readAsArrayBuffer(file);
            },

            async renderLibrary() {
                const books = await DB.getBooks();
                const grid = document.getElementById('library-grid');
                grid.innerHTML = '';

                if (books.length === 0) {
                    grid.innerHTML = '<p style="color:#666">Библиотека пуста.</p>';
                    return;
                }

                books.forEach(book => {
                    const el = document.createElement('div');
                    el.className = 'book-card';
                    el.innerHTML = `
                <div class="book-actions">
                    <div class="btn-edit" onclick="event.stopPropagation(); app.renameBook(${book.id}, '${book.title.replace(/'/g, "\\'")}')"><i class="fas fa-pen"></i></div>
                    <div class="btn-delete" onclick="event.stopPropagation(); app.deleteBook(${book.id})"><i class="fas fa-trash"></i></div>
                </div>
                <div class="book-icon"><i class="fas fa-book"></i></div>
                <div class="book-title">${book.title}</div>
                <div style="font-size:12px; color:#666; margin-top:5px">Стр: ${book.currentPage}</div>
            `;
                    el.onclick = () => reader.open(book.id);
                    grid.appendChild(el);
                });
            },

            async deleteBook(id) {
                if (confirm("Удалить книгу?")) {
                    await DB.deleteBook(id);
                    this.renderLibrary();
                }
            },

            async renameBook(id, currentTitle) {
                const newTitle = prompt("Введите новое название книги:", currentTitle);
                if (newTitle && newTitle.trim() && newTitle !== currentTitle) {
                    await DB.renameBook(id, newTitle.trim());
                    this.renderLibrary();
                }
            }
        };

        /* =========================================
           READER LOGIC
           ========================================= */
        const reader = {
            pdf: null,
            currentBookId: null,
            pageNum: 1,
            totalPages: 0,

            async open(id) {
                const book = await DB.getBook(id);
                if (!book) return;

                this.currentBookId = id;
                this.pageNum = book.currentPage || 1;

                const url = URL.createObjectURL(book.blob);
                const loadingTask = pdfjsLib.getDocument(url);

                this.pdf = await loadingTask.promise;
                this.totalPages = this.pdf.numPages;

                app.nav('reader');
                if (typeof fullscreen !== 'undefined') fullscreen.enter();
                this.renderPage(this.pageNum);
            },

            async renderPage(num) {
                const page = await this.pdf.getPage(num);
                const textContent = await page.getTextContent();

                const div = document.getElementById('page-content');
                div.innerHTML = '';
                div.scrollTop = 0;
                div.scrollLeft = 0;

                let fullText = textContent.items.map(item => item.str).join(' ');

                // Регулярное выражение для определения заголовков глав
                const chapterPattern = /^(Chapter\s+\d+|Глава\s+\d+|CHAPTER\s+\d+|ГЛАВА\s+\d+|Part\s+\d+|Часть\s+\d+|PART\s+\d+|ЧАСТЬ\s+\d+|\d+\.\s+[A-ZА-Я])/i;

                // Разбиваем текст на параграфы
                const paras = fullText.split(/\n\s*\n/).filter(p => p.trim());

                if (paras.length < 2) {
                    this.htmlifyWords(fullText, div);
                } else {
                    paras.forEach((pText, index) => {
                        const trimmedText = pText.trim();

                        // Проверяем, является ли это заголовком главы
                        const isChapter = chapterPattern.test(trimmedText) ||
                            (trimmedText.length < 100 && trimmedText === trimmedText.toUpperCase() && trimmedText.length > 5);

                        if (isChapter) {
                            const chapterDiv = document.createElement('div');
                            chapterDiv.className = index > 0 ? 'chapter-break' : '';

                            const title = document.createElement('h2');
                            title.className = 'chapter-title';
                            title.textContent = trimmedText;
                            chapterDiv.appendChild(title);
                            div.appendChild(chapterDiv);
                        } else {
                            const p = document.createElement('p');
                            p.style.marginBottom = '1em';
                            p.style.textIndent = '1.5em';
                            this.htmlifyWords(trimmedText, p);
                            div.appendChild(p);
                        }
                    });
                }

                document.getElementById('page-info').textContent = `${num} / ${this.totalPages}`;
                document.getElementById('btn-prev').disabled = num <= 1;
                document.getElementById('btn-next').disabled = num >= this.totalPages;

                // Update fullscreen page info
                fullscreen.updatePageInfo();

                DB.updateProgress(this.currentBookId, num);
            },

            htmlifyWords(text, container) {
                const words = text.split(/([a-zA-Z''-]+)/);
                words.forEach(frag => {
                    if (/[a-zA-Z]/.test(frag)) {
                        const span = document.createElement('span');
                        span.className = 'word';
                        span.textContent = frag;
                        span.onclick = (e) => translator.clickWord(e.target);
                        container.appendChild(span);
                    } else {
                        container.appendChild(document.createTextNode(frag));
                    }
                });
            },

            changePage(offset) {
                const newPage = this.pageNum + offset;
                if (newPage >= 1 && newPage <= this.totalPages) {
                    this.pageNum = newPage;
                    this.renderPage(newPage);
                }
            }
        };

        /* =========================================
           TRANSLATOR & VOCABULARY
           ========================================= */
        const vocab = {
            list: JSON.parse(localStorage.getItem('vocab')) || [],
            current: null,

            save() { localStorage.setItem('vocab', JSON.stringify(this.list)); this.render(); },

            toggle() {
                if (!this.current) return;
                const idx = this.list.findIndex(w => w.orig === this.current.orig);
                if (idx >= 0) {
                    this.list.splice(idx, 1);
                    document.getElementById('btn-star').classList.remove('saved');
                } else {
                    this.list.push(this.current);
                    document.getElementById('btn-star').classList.add('saved');
                }
                this.save();
            },

            checkSaved(word) {
                const isSaved = this.list.some(w => w.orig === word);
                const btn = document.getElementById('btn-star');
                isSaved ? btn.classList.add('saved') : btn.classList.remove('saved');
            },

            render() {
                const div = document.getElementById('vocab-list');
                div.innerHTML = '';
                [...this.list].reverse().forEach(w => {
                    const el = document.createElement('div');
                    el.className = 'vocab-item';
                    el.innerHTML = `<div><b>${w.orig}</b><br><small>${w.trans}</small></div>`;
                    div.appendChild(el);
                });
            }
        };

        const translator = {
            async translate(text) {
                const popup = document.getElementById('trans-popup');
                const pOrig = document.getElementById('p-orig');
                const pTrans = document.getElementById('p-trans');

                popup.classList.add('visible');
                pOrig.textContent = text;
                pTrans.textContent = '...';

                vocab.current = { orig: text.toLowerCase(), trans: '' };
                vocab.checkSaved(vocab.current.orig);

                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const trans = data[0].map(x => x[0]).join('');

                    pTrans.textContent = trans;
                    vocab.current.trans = trans;
                } catch (e) { pTrans.textContent = "Ошибка сети"; }
            },

            clickWord(el) {
                document.querySelectorAll('.word.active').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
                const text = el.textContent.replace(/[^a-zA-Z-]/g, "");
                this.translate(text);
            },

            translateSelection() {
                const text = this.savedSelection || window.getSelection().toString().trim();
                if (text) {
                    this.translate(text);
                    document.getElementById('tooltip').style.display = 'none';
                    this.savedSelection = null;
                    window.getSelection().removeAllRanges();
                }
            }
        };

        document.addEventListener('mouseup', (e) => {
            if (e.target.closest('#trans-popup') || e.target.closest('#tooltip')) return;
            const txt = window.getSelection().toString().trim();
            const tooltip = document.getElementById('tooltip');

            if (txt.length > 1) {
                translator.savedSelection = txt; // Сохраняем выделенный текст
                const rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
                tooltip.style.left = rect.left + 'px';
                tooltip.style.top = (rect.top - 40) + 'px';
                tooltip.style.display = 'block';
            } else {
                tooltip.style.display = 'none';
                translator.savedSelection = null;
            }
        });
        document.addEventListener('mousedown', (e) => {
            // Не скрываем popup и не сбрасываем selection если кликаем на tooltip
            if (e.target.closest('#tooltip')) return;

            if (!e.target.closest('#trans-popup') && !e.target.classList.contains('word')) {
                document.getElementById('trans-popup').classList.remove('visible');
                document.querySelectorAll('.word.active').forEach(x => x.classList.remove('active'));
            }
        });

        /* =========================================
           GAME LOGIC
           ========================================= */
        const game = {
            score: 0,
            total: 0,
            streak: 0,
            mode: 'word-to-trans', // 'word-to-trans' или 'trans-to-word'
            currentTarget: null,
            answered: false,

            init() {
                // Загружаем статистику из localStorage
                const savedStats = localStorage.getItem('game-stats');
                if (savedStats) {
                    const stats = JSON.parse(savedStats);
                    this.score = stats.score || 0;
                    this.total = stats.total || 0;
                }
            },

            saveStats() {
                localStorage.setItem('game-stats', JSON.stringify({
                    score: this.score,
                    total: this.total
                }));
            },

            start() {
                this.init();
                const list = vocab.list;
                const ui = document.getElementById('game-ui');

                if (list.length < 4) {
                    ui.innerHTML = `
                        <div class="game-container">
                            <div class="game-empty">
                                <i class="fas fa-book-open"></i>
                                <h3>Недостаточно слов для тренировки</h3>
                                <p>Добавьте минимум 4 слова в словарь.<br>Сейчас у вас: ${list.length} ${this.getWordForm(list.length)}</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                this.renderGame();
            },

            getWordForm(n) {
                if (n === 1) return 'слово';
                if (n >= 2 && n <= 4) return 'слова';
                return 'слов';
            },

            setMode(mode) {
                this.mode = mode;
                this.renderGame();
            },

            renderGame() {
                const list = vocab.list;
                const ui = document.getElementById('game-ui');
                this.answered = false;

                // Выбираем случайное слово
                const target = list[Math.floor(Math.random() * list.length)];
                this.currentTarget = target;

                // Собираем варианты ответов
                let options = [target];
                while (options.length < 4) {
                    const rnd = list[Math.floor(Math.random() * list.length)];
                    if (!options.includes(rnd)) options.push(rnd);
                }
                options.sort(() => 0.5 - Math.random());

                const accuracy = this.total > 0 ? Math.round((this.score / this.total) * 100) : 0;

                ui.innerHTML = `
                    <div class="game-container">
                        <div class="game-stats">
                            <div class="stat-item">
                                <div class="stat-value">${this.score}</div>
                                <div class="stat-label">Правильно</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${this.total}</div>
                                <div class="stat-label">Всего</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${accuracy}%</div>
                                <div class="stat-label">Точность</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" style="color: var(--gold)">🔥 ${this.streak}</div>
                                <div class="stat-label">Серия</div>
                            </div>
                        </div>

                        <div class="game-mode-selector">
                            <button class="mode-btn ${this.mode === 'word-to-trans' ? 'active' : ''}" onclick="game.setMode('word-to-trans')">
                                <i class="fas fa-arrow-right"></i> Слово → Перевод
                            </button>
                            <button class="mode-btn ${this.mode === 'trans-to-word' ? 'active' : ''}" onclick="game.setMode('trans-to-word')">
                                <i class="fas fa-arrow-left"></i> Перевод → Слово
                            </button>
                        </div>

                        <div class="game-card">
                            <div class="game-word">${this.mode === 'word-to-trans' ? target.orig : target.trans}</div>
                            <div class="game-hint">${this.mode === 'word-to-trans' ? 'Выберите правильный перевод' : 'Выберите правильное слово'}</div>
                            <div id="opts"></div>
                            <div id="game-feedback"></div>
                        </div>
                    </div>
                `;

                const optsDiv = document.getElementById('opts');
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = this.mode === 'word-to-trans' ? opt.trans : opt.orig;
                    btn.onclick = () => this.checkAnswer(btn, opt, target, options);
                    optsDiv.appendChild(btn);
                });
            },

            checkAnswer(btn, selected, target, allOptions) {
                if (this.answered) return;
                this.answered = true;
                this.total++;

                const feedbackDiv = document.getElementById('game-feedback');
                const allBtns = document.querySelectorAll('.option-btn');

                // Дизейблим все кнопки
                allBtns.forEach(b => b.disabled = true);

                if (selected === target) {
                    // Правильный ответ
                    this.score++;
                    this.streak++;
                    btn.classList.add('correct');
                    feedbackDiv.innerHTML = `
                        <div class="game-result success">
                            <i class="fas fa-check-circle"></i> Правильно! 
                            ${this.streak > 1 ? `<span style="color: var(--gold)">🔥 Серия: ${this.streak}</span>` : ''}
                        </div>
                        <button class="next-btn" onclick="game.renderGame()">
                            <i class="fas fa-arrow-right"></i> Следующее слово
                        </button>
                    `;
                } else {
                    // Неправильный ответ
                    this.streak = 0;
                    btn.classList.add('wrong');

                    // Показываем правильный ответ
                    const correctText = this.mode === 'word-to-trans' ? target.trans : target.orig;
                    allBtns.forEach(b => {
                        if (b.textContent === correctText) {
                            b.classList.add('show-correct');
                        }
                    });

                    feedbackDiv.innerHTML = `
                        <div class="game-result error">
                            <i class="fas fa-times-circle"></i> Неправильно!<br>
                            <small>Правильный ответ: <strong>${correctText}</strong></small>
                        </div>
                        <button class="next-btn" onclick="game.renderGame()">
                            <i class="fas fa-arrow-right"></i> Следующее слово
                        </button>
                    `;
                }

                this.saveStats();
                this.updateStatsDisplay();
            },

            updateStatsDisplay() {
                const accuracy = this.total > 0 ? Math.round((this.score / this.total) * 100) : 0;
                const statValues = document.querySelectorAll('.stat-value');
                if (statValues.length >= 4) {
                    statValues[0].textContent = this.score;
                    statValues[1].textContent = this.total;
                    statValues[2].textContent = accuracy + '%';
                    statValues[3].innerHTML = `🔥 ${this.streak}`;
                }
            },

            resetStats() {
                if (confirm('Сбросить всю статистику?')) {
                    this.score = 0;
                    this.total = 0;
                    this.streak = 0;
                    this.saveStats();
                    this.start();
                }
            }
        };

        // Start App
        app.init();

    </script>
</body>

</html>
